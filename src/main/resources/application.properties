server.port=${SERVER_PORT:8080}

python.service.url=${PYTHON_SERVICE_URL:http://127.0.0.1:5000}
python.service.connect-timeout=${PYTHON_CONNECT_TIMEOUT:2s}
python.service.read-timeout=${PYTHON_READ_TIMEOUT:30s}

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://127.0.0.1:5500,http://localhost:5500,http://localhost:3000}

database.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/aegis}
database.username=${DB_USERNAME:root}
database.password=${DB_PASSWORD:}
database.schema-action=${DB_SCHEMA_ACTION:validate}
database.show-sql=${DB_SHOW_SQL:false}
database.pool.maximum-size=${DB_POOL_MAXIMUM_SIZE:10}
database.pool.minimum-idle=${DB_POOL_MINIMUM_IDLE:2}
database.pool.connection-timeout-ms=${DB_POOL_CONNECTION_TIMEOUT_MS:30000}
database.pool.idle-timeout-ms=${DB_POOL_IDLE_TIMEOUT_MS:600000}
database.pool.max-lifetime-ms=${DB_POOL_MAX_LIFETIME_MS:1800000}
